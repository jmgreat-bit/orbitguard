<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OrbitGuard — autonomous CubeSat flight controller</title>
  <meta name="description" content="A 1U CubeSat simulated with real orbital physics, flown by an AI planner under a deterministic safety supervisor.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%277%27 fill=%27none%27 stroke=%27%235cc8e0%27 stroke-width=%272%27/%3E%3Cellipse cx=%2716%27 cy=%2716%27 rx=%2714%27 ry=%275.5%27 fill=%27none%27 stroke=%27%235cc8e0%27 stroke-width=%271.5%27 transform=%27rotate(-28 16 16)%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <div id="app">
    <header class="top-bar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="7" fill="none" stroke="currentColor" stroke-width="1.6" />
          <ellipse cx="16" cy="16" rx="14" ry="5.5" fill="none" stroke="currentColor" stroke-width="1.2" transform="rotate(-28 16 16)" />
          <rect x="25.2" y="7.4" width="3.4" height="3.4" fill="var(--sun)" transform="rotate(-28 26.9 9.1)" />
        </svg>
        <div>
          <h1>OrbitGuard</h1>
          <p class="brand-sub">1U CubeSat, flown autonomously</p>
        </div>
      </div>

      <div class="clock" aria-live="off">
        <span class="clock-value" id="mission-time">T+00:00:00</span>
        <span class="clock-utc" id="utc-time">—</span>
      </div>

      <div class="warp" role="group" aria-label="Simulation speed">
        <button class="warp-btn" id="time-slower" title="Slower" aria-label="Slower">‹</button>
        <button class="warp-speed" id="time-speed-btn" title="Pause or resume" aria-pressed="false"><span id="time-speed">1×</span></button>
        <button class="warp-btn" id="time-faster" title="Faster" aria-label="Faster">›</button>
        <label class="warp-auto" title="Drop to real time when something critical happens">
          <input type="checkbox" id="auto-slow"> Slow down for alerts
        </label>
      </div>
    </header>

    <main id="page-content" class="page-content"></main>

    <nav class="bottom-nav" aria-label="Views">
      <button class="nav-btn" data-page="home" onclick="location.hash='home'"><span>Overview</span></button>
      <button class="nav-btn" data-page="ship" onclick="location.hash='ship'"><span>Satellite</span></button>
      <button class="nav-btn" data-page="engine" onclick="location.hash='engine'"><span>Power &amp; propulsion</span></button>
      <button class="nav-btn" data-page="space" onclick="location.hash='space'"><span>Space environment</span></button>
      <button class="nav-btn" data-page="crisis" onclick="location.hash='crisis'"><span>Drills &amp; log</span></button>
    </nav>
  </div>

  <div id="card-modal" class="modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="card-modal-title">
    <div class="modal-panel">
      <div class="modal-head">
        <h2 id="card-modal-title">—</h2>
        <button class="icon-btn" id="card-modal-close" aria-label="Close">×</button>
      </div>
      <div class="modal-body prose" id="card-modal-body"></div>
    </div>
  </div>

  <div id="mission-lost" class="mission-lost" hidden>
    <div class="ml-panel" role="alertdialog" aria-labelledby="ml-title">
      <h2 id="ml-title">Mission lost</h2>
      <p data-reason></p>
      <p class="ml-stats" data-stats></p>
      <button class="btn btn-primary" id="mission-restart">Start a new mission</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
